version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: calypso
    main: ./cmd/calypso
    binary: calypso
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: indexer
    name: Claypso
  draft: false
  prerelease: auto
  # Delete same-named assets before uploading so re-running a release on an
  # existing tag doesn't fail with "422 already_exists".
  replace_existing_artifacts: true
