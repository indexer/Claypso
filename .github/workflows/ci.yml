name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: cross-compile (windows, darwin)
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
          GOOS=darwin go build ./...
          GOOS=darwin go vet ./...

      - name: test
        run: go test ./... -count=1 -race -timeout 300s

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.2
